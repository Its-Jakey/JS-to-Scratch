[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch3"
version = "0.1.0"
description = "Generate Scratch 3.0 (.sb3) projects from Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["scratch3*", "js2scratch*"]

[tool.setuptools.package-data]
scratch3 = ["assets/*.svg"]
js2scratch = ["runtime/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
